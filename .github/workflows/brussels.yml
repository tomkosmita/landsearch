name: Brussels Housing Monitor

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (parse and report, send nothing, do not save state)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: brussels-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Guard — block execution on main
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "ERROR: This workflow must not run on main branch."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Before scraping, not after: a broken parser should fail the job rather
      # than quietly sending rubbish to the channel.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run Brussels monitor
        env:
          TELEGRAM_BRUSSELS_BOT_TOKEN: ${{ secrets.TELEGRAM_BRUSSELS_BOT_TOKEN }}
          TELEGRAM_BRUSSELS_CHAT_ID: ${{ secrets.TELEGRAM_BRUSSELS_CHAT_ID }}
          BRUSSELS_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python -m scraper.brussels.main

      - name: Commit updated brussels_seen.json
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/brussels_seen.json ]; then
            echo "no state file produced — nothing to commit"
            exit 0
          fi
          git add data/brussels_seen.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: update Brussels seen listings [skip ci]"
          # Two workflows now push to this branch; they touch different files,
          # but the pull/push window is still a real race.
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && \
              git push origin "$GITHUB_REF_NAME" && exit 0
            echo "push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "ERROR: could not push after 3 attempts"
          exit 1
